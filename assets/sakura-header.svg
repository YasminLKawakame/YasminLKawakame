<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title description">
  <title id="title">Yasmin Kawakame — My learning space</title>
  <desc id="description">Pétalas de cerejeira caem suavemente sobre um banner em rosa e lilás, inspirado na primavera japonesa.</desc>
  <defs>
    <linearGradient id="spring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fce4ec" />
      <stop offset="0.5" stop-color="#f8bbd0" />
      <stop offset="1" stop-color="#e1bee7" />
    </linearGradient>
    <clipPath id="banner">
      <path d="M0 0H1000V174C840 225 710 147 520 190S190 236 0 184Z" />
    </clipPath>
    <path id="petal" d="M-2-9C3-13 10-7 9 0C8 7 2 12-3 10C-8 8-11 1-8-5L-3-4Z" />
    <g id="blossom" fill="#fff2f6" stroke="#e6a4bc" stroke-width="0.7">
      <use href="#petal" transform="translate(0 -10) scale(.9)" />
      <use href="#petal" transform="rotate(72) translate(0 -10) scale(.9)" />
      <use href="#petal" transform="rotate(144) translate(0 -10) scale(.9)" />
      <use href="#petal" transform="rotate(216) translate(0 -10) scale(.9)" />
      <use href="#petal" transform="rotate(288) translate(0 -10) scale(.9)" />
      <circle r="3" fill="#d889aa" stroke="none" />
    </g>
  </defs>
  <style>
    .fall {
      animation: fall var(--duration, 12s) var(--delay, 0s) linear infinite;
    }
    .flutter {
      transform: scale(var(--size, 1));
      animation: flutter 3.5s ease-in-out infinite alternate;
    }
    @keyframes fall {
      from { transform: translate(-16px, -35px); }
      to { transform: translate(42px, 265px); }
    }
    @keyframes flutter {
      from { transform: rotate(-32deg) scale(var(--size, 1)) scaleX(.75); }
      to { transform: rotate(48deg) scale(var(--size, 1)) scaleX(1); }
    }
    @media (max-width: 480px) {
      .name { font-size: 58px; }
      .tagline { font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fall, .flutter { animation: none; }
    }
  </style>
  <g clip-path="url(#banner)">
    <path fill="url(#spring)" d="M0 0H1000V230H0Z" />
    <path d="M-12 7C25 16 52 40 89 45M38 24L52 6M62 37L104 22M1012 13C974 18 942 40 914 57M970 28L955 4M942 42L903 25" fill="none" stroke="#bd839a" stroke-width="3" stroke-linecap="round" opacity=".6" />
    <use href="#blossom" transform="translate(50 24) scale(.75)" />
    <use href="#blossom" transform="translate(91 43) scale(.95) rotate(12)" />
    <use href="#blossom" transform="translate(104 21) scale(.55)" />
    <use href="#blossom" transform="translate(955 14) scale(.75) rotate(24)" />
    <use href="#blossom" transform="translate(916 53) scale(1.05)" />
    <use href="#blossom" transform="translate(904 25) scale(.55) rotate(15)" />
    <g fill="#dc86a7" opacity=".65">
      <g transform="translate(36 0)"><g class="fall" style="--duration:11s;--delay:-2s" transform="translate(0 20)"><use class="flutter" href="#petal" /></g></g>
      <g transform="translate(110 0)"><g class="fall" style="--duration:14s;--delay:-9s" transform="translate(0 130)"><use class="flutter" href="#petal" style="--size:.65" /></g></g>
      <g transform="translate(178 0)"><g class="fall" style="--duration:12s;--delay:-5s" transform="translate(0 70)"><use class="flutter" href="#petal" /></g></g>
      <g transform="translate(251 0)"><g class="fall" style="--duration:15s;--delay:-12s" transform="translate(0 180)"><use class="flutter" href="#petal" style="--size:.7" /></g></g>
      <g transform="translate(331 0)"><g class="fall" style="--duration:13s;--delay:-1s" transform="translate(0 8)"><use class="flutter" href="#petal" style="--size:.6" /></g></g>
      <g transform="translate(421 0)"><g class="fall" style="--duration:16s;--delay:-11s" transform="translate(0 160)"><use class="flutter" href="#petal" style="--size:.55" /></g></g>
      <g transform="translate(510 0)"><g class="fall" style="--duration:14s;--delay:-3s" transform="translate(0 38)"><use class="flutter" href="#petal" style="--size:.6" /></g></g>
      <g transform="translate(601 0)"><g class="fall" style="--duration:12s;--delay:-10s" transform="translate(0 190)"><use class="flutter" href="#petal" style="--size:.65" /></g></g>
      <g transform="translate(686 0)"><g class="fall" style="--duration:15s;--delay:-4s" transform="translate(0 50)"><use class="flutter" href="#petal" style="--size:.7" /></g></g>
      <g transform="translate(759 0)"><g class="fall" style="--duration:11s;--delay:-6s" transform="translate(0 100)"><use class="flutter" href="#petal" /></g></g>
      <g transform="translate(832 0)"><g class="fall" style="--duration:14s;--delay:-11s" transform="translate(0 170)"><use class="flutter" href="#petal" style="--size:.65" /></g></g>
      <g transform="translate(899 0)"><g class="fall" style="--duration:13s;--delay:-4s" transform="translate(0 65)"><use class="flutter" href="#petal" /></g></g>
      <g transform="translate(959 0)"><g class="fall" style="--duration:16s;--delay:-9s" transform="translate(0 115)"><use class="flutter" href="#petal" style="--size:.6" /></g></g>
    </g>
    <g fill="#70445d" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text class="name" x="500" y="98" font-size="48" font-weight="600">Yasmin Kawakame</text>
      <text class="tagline" x="500" y="137" font-size="22" letter-spacing="1">My learning space</text>
    </g>
  </g>
</svg>
